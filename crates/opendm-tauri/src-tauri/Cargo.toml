[package]
name = "opendm"
version = "0.2.0"
description = "OpenDM : Gestionnaire de Téléchargement Libre et Accéléré en Rust"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
opendm-core = { path = "../../opendm-core" }
opendm-muxer = { path = "../../opendm-muxer" }
opendm-extractors = { path = "../../opendm-extractors" }
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
byteorder = { workspace = true }
